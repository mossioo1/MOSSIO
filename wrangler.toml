name = "mossio"
main = "worker/index.js"
compatibility_date = "2026-11-13"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mossio-db"
database_id = "b064c4c4-9a30-4851-ac5a-affd40d6d372"
migrations_dir = "migrations"

[vars]
APP_NAME = "MOSSIO"
SESSION_TTL_DAYS = "7"
MAX_UPLOAD_MB = "25"
CLOUDINARY_CLOUD_NAME = "gauykzlb"
